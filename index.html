<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moonlit Tails · Week 2</title>
<meta name="description" content="Moonlit Tails, a cozy VR bartending game for Quest: Week 2 progress video.">
<meta property="og:title" content="Moonlit Tails · Week 2">
<meta property="og:description" content="A cozy VR bartending game for Quest: Week 2 progress video.">
<meta property="og:image" content="https://driedpampas.github.io/moonlit-tails/poster.jpg">
<style>
  :root {
    --bg: #11132a;
    --ink: #f4efe4;
    --muted: #a9a7c2;
    --accent: #f0b35b;
    --line: rgba(255, 255, 255, .09);
    --hover: rgba(255, 255, 255, .05);
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 960px; margin: 0 auto; padding: 40px 16px 56px; }

  header { margin-bottom: 20px; }
  .eyebrow { margin: 0 0 6px; color: var(--accent); font-size: 13px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; }
  h1 { margin: 0; font-size: clamp(28px, 4.5vw, 38px); line-height: 1.15; font-weight: 700; letter-spacing: -.01em; }
  .lede { margin: 8px 0 0; color: var(--muted); max-width: 60ch; }

  video {
    display: block;
    width: 100%;
    aspect-ratio: 16 / 9;
    background: #000;
    border-radius: 12px;
    box-shadow: 0 12px 40px rgba(0, 0, 0, .45);
  }

  h2 { margin: 32px 0 8px; font-size: 13px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  .chapters { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); column-gap: 24px; }
  .chapters button {
    all: unset;
    box-sizing: border-box;
    display: flex;
    gap: 12px;
    width: 100%;
    padding: 9px 10px;
    border-bottom: 1px solid var(--line);
    cursor: pointer;
    border-radius: 6px;
  }
  .chapters button:hover { background: var(--hover); }
  .chapters button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .chapters time { flex: none; width: 2.6em; color: var(--accent); font-variant-numeric: tabular-nums; }

  footer { margin-top: 32px; color: var(--muted); font-size: 14px; }
  footer a { color: var(--ink); text-underline-offset: 3px; }
</style>
</head>
<body>
<main>
  <header>
    <p class="eyebrow">Week 2 progress</p>
    <h1>Moonlit Tails</h1>
    <p class="lede">A cozy VR bartending game for Quest. Mix drinks with your own hands for animal customers who come back every night with their stories.</p>
  </header>

  <video id="demo" controls preload="metadata" playsinline poster="poster.jpg">
    <source src="week2.mp4" type="video/mp4">
    <a href="week2.mp4">Open the video</a>
  </video>

  <h2>Chapters</h2>
  <ol class="chapters">
    <li><button data-t="8"><time>0:08</time>Orders and tickets</button></li>
    <li><button data-t="23"><time>0:23</time>Mixed drink: pour and shake</button></li>
    <li><button data-t="41"><time>0:41</time>Ice and garnish</button></li>
    <li><button data-t="49"><time>0:49</time>Serving at the coaster</button></li>
    <li><button data-t="60"><time>1:00</time>Layered drink: stir and layer</button></li>
    <li><button data-t="81"><time>1:21</time>A wrong drink, then adjusted</button></li>
    <li><button data-t="100"><time>1:40</time>Reset button</button></li>
    <li><button data-t="109"><time>1:49</time>How-to-play board</button></li>
  </ol>

  <footer>
    Recorded in the Unity editor without a headset; a script moves the props through the real game rules.
    <a href="https://github.com/driedpampas/moonlit-tails">Project on GitHub</a>
  </footer>
</main>
<script>
  const video = document.getElementById('demo');
  document.querySelectorAll('.chapters button').forEach(b => b.addEventListener('click', () => {
    video.currentTime = Number(b.dataset.t);
    video.play();
    video.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }));
</script>
</body>
</html>
